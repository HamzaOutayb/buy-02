services:
  sonarqube-db:
    image: postgres:17-alpine
    container_name: buy-01-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-password}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: buy-01-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-password}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  jenkins:
    build: .
    container_name: buy-01-jenkins
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in jenkins/.env}"
    ports:
      - "${JENKINS_PORT:-8088}:8080"
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      DOCKER_HOST: unix:///var/run/docker.sock
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env}
      GITHUB_REPOSITORY_URL: ${GITHUB_REPOSITORY_URL:-https://github.com/yahyaahs/safezone.git}
      GITHUB_USERNAME: ${GITHUB_USERNAME:?Set GITHUB_USERNAME in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}
      SMTP_HOST: ${SMTP_HOST:-live.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-smtp@mailtrap.io}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in jenkins/.env}
      SMTP_FROM: ${SMTP_FROM:-smtp@mailtrap.io}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-houtayb@gmail.com}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/usr/share/jenkins/ref/casc.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sonarqube_db_data:
    name: buy01-ci_sonarqube_db_data
  sonarqube_data:
    name: buy01-ci_sonarqube_data
  sonarqube_extensions:
    name: buy01-ci_sonarqube_extensions
  sonarqube_logs:
    name: buy01-ci_sonarqube_logs
  jenkins_home:
    name: buy01-ci_jenkins_home
