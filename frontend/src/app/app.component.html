<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" routerLink="/products">Buy</a>

    <div class="nav-actions">
      @if (authenticated()) {
        @if (seller) {
          <a class="nav-button" routerLink="/seller/products">Dashboard</a>
        }
        <a
          class="nav-avatar"
          routerLink="/profile"
          [attr.aria-label]="(currentUser()?.name ?? 'Your') + ' profile'"
          title="Profile"
        >
          @if (currentUser(); as user) {
            @if (user.avatar) {
              <img [src]="user.avatar" alt="">
            } @else {
              <span>{{ user.name.charAt(0).toUpperCase() }}</span>
            }
          } @else {
            <span>U</span>
          }
        </a>
        <button class="nav-button" type="button" (click)="logout()">
          Log out
        </button>
      } @else {
        <a class="nav-button" routerLink="/login">Login</a>
        <a class="nav-button nav-button-primary" routerLink="/register">
          Register
        </a>
      }
    </div>
  </nav>
</header>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
