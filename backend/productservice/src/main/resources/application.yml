server:
  port: 8082

spring:
  application:
    name: product-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27018/productdb}}
      auto-index-creation: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-which-is-long-enough}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:development-internal-service-token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:product-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
