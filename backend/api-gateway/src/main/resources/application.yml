server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:gateway.p12
    key-store-password: ${HTTPS_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: gateway

spring:
  application:
    name: api-gateway

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-which-is-long-enough}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:api-gateway}

management:
  endpoints:
    web:
      exposure:
        include: health,info