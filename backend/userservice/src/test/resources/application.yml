server:
  port: 0

spring:
  application:
    name: user-service-test
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/user-service-test-db}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/user-service-test-db}
      auto-index-creation: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

security:
  jwt:
    secret: change-this-development-secret-key-which-is-long-enough
    expiration-ms: 86400000
