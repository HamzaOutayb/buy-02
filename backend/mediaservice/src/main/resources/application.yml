server:
  port: 8083

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: media-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.mediaservice.mediaservice.service
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.mediaservice.mediaservice.service.MediaService$ProductDeletedEvent
  application:
    name: media-service
  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27019/media-service-db}}
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27019/media-service-db}}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 11MB

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-which-is-long-enough}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:media-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:do1ffwghn}
  api-key: ${CLOUDINARY_API_KEY:391888276776149}
  api-secret: ${CLOUDINARY_API_SECRET:5R7Te9OoZLM8XmXjdDLDanAIuNo}
