spring.application.name=productService
server.port=8082

eureka.client.service-url.defaultZone=http://server:8761/eureka/
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=productDB
management.endpoints.web.exposure.include=health
spring.kafka.bootstrap-servers=broker:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=product-service-inventory
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.product.productService.dto.OrderItemEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.product.productService.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false