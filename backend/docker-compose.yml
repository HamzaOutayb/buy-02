services:
  server:
    hostname: server
    image: ${IMAGE_NAMESPACE:-mr-jenk}/server:${IMAGE_TAG:-latest}
    build: ./server
    ports:
      - "8761:8761"
    depends_on:
      - mongodb

  user:
    hostname: user
    image: ${IMAGE_NAMESPACE:-mr-jenk}/user:${IMAGE_TAG:-latest}
    build: ./userService
    ports:
      - "8081"
    depends_on:
      - server
    environment:
      - JWT_SECRET=${JWT_SECRET:-test}
      - MONGODB_URI=${MONGODB_URI:-test}

  product:
    hostname: product
    image: ${IMAGE_NAMESPACE:-mr-jenk}/product:${IMAGE_TAG:-latest}
    build: ./productService
    ports:
      - "8082"
    depends_on:
      - server
      - broker
    environment:
      - JWT_SECRET=${JWT_SECRET:-test}
      - MONGODB_URI=${MONGODB_URI:-test}

  media:
    hostname: media
    image: ${IMAGE_NAMESPACE:-mr-jenk}/media:${IMAGE_TAG:-latest}
    build: ./mediaService
    ports:
      - "8083"
    depends_on:
      - server
      - broker
    environment:
      - JWT_SECRET=${JWT_SECRET:-test}
      - MONGODB_URI=${MONGODB_URI:-test}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-test}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-test}

  order:
    hostname: order
    image: ${IMAGE_NAMESPACE:-mr-jenk}/order:${IMAGE_TAG:-latest}
    build: ./orderService
    ports:
      - "8084"
    depends_on:
      - server
      - broker
      - product
    environment:
      - JWT_SECRET=${JWT_SECRET:-test}
      - MONGODB_URI=${MONGODB_URI:-test}

  gateway:
    hostname: gatewat
    image: ${IMAGE_NAMESPACE:-mr-jenk}/gateway:${IMAGE_TAG:-latest}
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
      - user
      - product
      - media
      - order
    environment:
      - JWT_SECRET=${JWT_SECRET:-test}
      - SERVER_SSL_KEY_STORE_PASSWORD=${SERVER_SSL_KEY_STORE_PASSWORD:-test}


  mongodb:
    image: mongo:7.0
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db

  broker:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
