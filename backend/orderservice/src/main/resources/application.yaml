spring:
  application:
    name: orderservice
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:mongodb://localhost:27021/order-service-db}
      auto-index-creation: true

server:
  port: 8084

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-which-is-long-enough}

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://product-service:8082}
    internal-token: ${INTERNAL_SERVICE_TOKEN:development-internal-service-token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:order-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info
