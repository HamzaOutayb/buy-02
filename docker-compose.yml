name: buy-01

services:
  user-mongodb:
    image: mongo:7.0.14
    container_name: user-service-mongodb
    volumes:
      - user_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok", "localhost:27017/test"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  product-mongodb:
    image: mongo:7.0.14
    container_name: product-service-mongodb
    volumes:
      - product_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok", "localhost:27017/test"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  media-mongodb:
    image: mongo:7.0.14
    container_name: media-service-mongodb
    volumes:
      - media_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok", "localhost:27017/test"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
    
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
    
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  eureka-server:
    image: buy01-eureka-server:${IMAGE_TAG:-latest}
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    image: buy01-user-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/userservice
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SPRING_MONGODB_URI: mongodb://user-mongodb:27017/user-service-db
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      user-mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  product-service:
    image: buy01-product-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/productservice
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      SPRING_MONGODB_URI: mongodb://product-mongodb:27017/product-service-db
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      product-mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  media-service:
    image: buy01-media-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/mediaservice
      dockerfile: Dockerfile
    container_name: media-service
    environment:
      SPRING_MONGODB_URI: mongodb://media-mongodb:27017/media-service-db
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      media-mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  api-gateway:
    image: buy01-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
      HTTPS_KEYSTORE_PASSWORD: ${HTTPS_KEYSTORE_PASSWORD:-changeit}
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsSk https://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    image: buy01-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buy-01-frontend
    ports:
      - "4200:4200"
    environment:
      # Allows the Angular dev-server proxy to forward requests to the
      # API gateway's self-signed HTTPS certificate without rejecting it.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  user_mongodb_data:
  product_mongodb_data:
  media_mongodb_data:
  media_object_storage_data:
  kafka_data:
  sonarqube_data:
  sonarqube_extensions: